<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 280" role="img" aria-labelledby="title desc">
  <title id="title">Default Blue Fish Skin</title>
  <desc id="desc">A bright blue cartoon fish with fins, a round eye, and a friendly side profile.</desc>
  <defs>
