    <style>
      #bc-boot-fallback{display:none;min-height:100dvh;padding:20px;place-items:center;background:radial-gradient(circle at 50% 18%,rgba(0,229,255,.12),transparent 34%),#02060a;color:#f4fbff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #bc-boot-fallback.is-visible{display:grid}
      .bc-boot-card{width:min(100%,560px);padding:28px 24px;border-radius:24px;border:1px solid rgba(0,229,255,.2);background:rgba(4,12,20,.94);box-shadow:0 28px 90px rgba(0,0,0,.58)}
      .bc-boot-label{font-size:12px;letter-spacing:.16em;color:#65eaff}.bc-boot-card h1{margin:12px 0 8px;font-size:clamp(28px,8vw,44px);line-height:1}.bc-boot-card p{margin:0;color:rgba(224,240,250,.72);line-height:1.55}
      .bc-boot-card button{width:100%;min-height:52px;margin-top:22px;border:1px solid rgba(151,247,255,.38);border-radius:16px;background:linear-gradient(180deg,rgba(0,229,255,.28),rgba(0,229,255,.1));color:#ecfeff;font-weight:800;font-size:15px}
    </style>

    <script>
      (function () {
        function clearRuntimeCaches() {
          var tasks = [];
          if ("serviceWorker" in navigator) {
            tasks.push(navigator.serviceWorker.getRegistrations().then(function (items) {
              return Promise.all(items.map(function (item) { return item.unregister(); }));
            }).catch(function () {}));
          }
          if ("caches" in window) {
            tasks.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            }).catch(function () {}));
          }
          return Promise.all(tasks);
        }

        window.__bcRecover = function () {
          clearRuntimeCaches().finally(function () {
            var url = new URL(window.location.href);
            url.searchParams.delete("bc-recovered");
            url.searchParams.set("bc-recover", String(Date.now()));
            window.location.replace(url.toString());
          });
        };

        /*
         * Recovery used to clear caches and force a reload on every new browser
         * session. That was an emergency black-screen hotfix and is intentionally
         * no longer automatic: healthy sessions must not be interrupted.
         */
        try {
          var cleanUrl = new URL(window.location.href);
          var changed = false;
          if (cleanUrl.searchParams.has("bc-recovered")) {
            cleanUrl.searchParams.delete("bc-recovered");
            changed = true;
          }
          if (cleanUrl.searchParams.has("bc-recover")) {
            cleanUrl.searchParams.delete("bc-recover");
            changed = true;
          }
          if (changed) {
            window.history.replaceState(window.history.state, "", cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
          }
        } catch (_) {}

        window.addEventListener("DOMContentLoaded", function () {
          var root = document.getElementById("root");
          var fallback = document.getElementById("bc-boot-fallback");
          var timer = 0;
          var observer;
          function settleIfMounted() {
            if (!root || root.childElementCount === 0) return false;
            window.clearTimeout(timer);
            if (observer) observer.disconnect();
            root.removeAttribute("aria-busy");
            if (fallback) fallback.classList.remove("is-visible");
            return true;
          }
          if (settleIfMounted()) return;
          if (root) {
            root.setAttribute("aria-busy", "true");
            observer = new MutationObserver(settleIfMounted);
            observer.observe(root, { childList: true });
          }
          timer = window.setTimeout(function () {
            if (!settleIfMounted() && fallback) fallback.classList.add("is-visible");
          }, 5500);
          // Do not hide #root: a slow bundle may still mount successfully.
        });
      })();
    </script>

  <body>
    <noscript><p style="padding:24px;color:#f4fbff;background:#02060a">Для интерактивного BlackCrown нужен JavaScript. Включи его в настройках браузера и перезагрузи страницу.</p></noscript>
    <div id="root"></div>
    <main id="bc-boot-fallback" role="alert">
      <section class="bc-boot-card">
        <div class="bc-boot-label">BLACKCROWN BOOT GUARD</div>
        <h1>Сайт не загрузился</h1>
        <p>Загрузка занимает больше времени, чем обычно. Можно подождать: сайт появится автоматически, когда будет готов. Если загрузка не продолжается, попробуй восстановление.</p>
        <button type="button" onclick="window.__bcRecover && window.__bcRecover()">Восстановить BlackCrown</button>
      </section>
    </main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
