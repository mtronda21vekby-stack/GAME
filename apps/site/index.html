<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- ВАЖНО (iOS Safari): НЕ красим верх/низ в сплошной цвет.
         Даем Safari “прозрачные/размытые” бары как у Apple (как в чате). -->
    <meta name="theme-color" content="rgba(0,0,0,0)" />
    <!-- Фолбэк для браузеров, которые не любят rgba в theme-color -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)" />

    <meta name="color-scheme" content="dark" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" href="/Icons/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/Icons/favicon.ico" />

    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>BlackCrown</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
