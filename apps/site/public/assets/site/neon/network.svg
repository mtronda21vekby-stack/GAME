<g fill="#c8fbff" font-family="ui-monospace,monospace"><text x="72" y="92" font-size="19" letter-spacing="7" opacity=".72">BLACKCROWN / SYSTEM NODE</text><text x="72" y="154" font-size="54" font-weight="700">NETWORK</text><text x="74" y="195" font-size="17" letter-spacing="4" opacity=".48">CONNECTED · RESPONSIVE · LIVE</text></g>
</svg>