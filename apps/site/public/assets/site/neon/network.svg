<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">BlackCrown network artwork</title><desc id="desc">Abstract cyan neon system lines on a deep black background.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020408"/><stop offset=".55" stop-color="#07101b"/><stop offset="1" stop-color="#020205"/></linearGradient><radialGradient id="halo" cx="68%" cy="42%" r="58%"><stop stop-color="#00e5ff" stop-opacity=".17"/><stop offset=".45" stop-color="#8b5cff" stop-opacity=".08"/><stop offset="1" stop-opacity="0"/></radialGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M58 0H0V58" fill="none" stroke="#69ebff" stroke-opacity=".045"/></pattern></defs>
<rect width="1200" height="720" rx="48" fill="url(#bg)"/><rect width="1200" height="720" rx="48" fill="url(#grid)"/><rect width="1200" height="720" rx="48" fill="url(#halo)"/>
