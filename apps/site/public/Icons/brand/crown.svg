<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Black Crown">
  <defs>
    <!-- Black metal gradients -->
    <linearGradient id="crownBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1A1F2B"/>
      <stop offset="45%" stop-color="#0B0F18"/>
      <stop offset="100%" stop-color="#04060B"/>
    </linearGradient>

    <linearGradient id="crownEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#7AA7FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </linearGradient>

    <radialGradient id="innerGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0E1424" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#050712" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Gentle highlight blur -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base silhouette -->
  <g filter="url(#shadow)">
    <!-- Crown main -->
    <path fill="url(#crownBody)" d="
      M88 188
      L140 300
      L256 196
      L372 300
      L424 188
      L424 344
      C424 384 392 416 352 416
      H160
      C120 416 88 384 88 344
      Z"/>

    <!-- Inner depth -->
    <path fill="url(#innerGlow)" opacity="0.9" d="
      M128 224
      L160 300
      L256 232
      L352 300
      L384 224
      L384 336
      C384 356 368 372 348 372
      H164
      C144 372 128 356 128 336
      Z"/>

    <!-- Top ridge highlight -->
    <path fill="none" stroke="url(#crownEdge)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
      d="M88 188 L140 300 L256 196 L372 300 L424 188"/>

    <!-- Spikes -->
    <g filter="url(#soft)">
      <path fill="#090C14" d="M140 300 L168 238 L196 300 Z"/>
      <path fill="#090C14" d="M256 196 L282 132 L308 196 Z"/>
      <path fill="#090C14" d="M372 300 L400 238 L428 300 Z"/>
      <!-- Spike glints -->
      <path fill="url(#crownEdge)" opacity="0.75" d="M168 238 L180 270 L154 270 Z"/>
      <path fill="url(#crownEdge)" opacity="0.8"  d="M282 132 L296 170 L268 170 Z"/>
      <path fill="url(#crownEdge)" opacity="0.75" d="M400 238 L412 270 L386 270 Z"/>
    </g>

    <!-- Jewels (subtle, dark) -->
    <g>
      <circle cx="140" cy="300" r="10" fill="#0A0F18"/>
      <circle cx="256" cy="196" r="12" fill="#0A0F18"/>
      <circle cx="372" cy="300" r="10" fill="#0A0F18"/>
      <circle cx="140" cy="300" r="10" fill="url(#crownEdge)" opacity="0.25"/>
      <circle cx="256" cy="196" r="12" fill="url(#crownEdge)" opacity="0.28"/>
      <circle cx="372" cy="300" r="10" fill="url(#crownEdge)" opacity="0.25"/>
    </g>

    <!-- Base rim -->
    <path fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="8" stroke-linejoin="round"
      d="M112 344 C112 372 136 396 164 396 H348 C376 396 400 372 400 344"/>
  </g>
</svg>
