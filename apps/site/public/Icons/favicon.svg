<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="BlackCrown favicon">
  <defs>
    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0F1A3A"/>
      <stop offset="55%" stop-color="#0B1022"/>
      <stop offset="100%" stop-color="#070A14"/>
    </radialGradient>

    <!-- Neon blue -->
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#B9FBFF"/>
      <stop offset="35%" stop-color="#45E8FF"/>
      <stop offset="70%" stop-color="#1788FF"/>
      <stop offset="100%" stop-color="#0A2BFF"/>
    </linearGradient>

    <!-- Metal edge -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#B6D8FF" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#2F7BFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#001A66" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="outerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feColorMatrix in="b" type="matrix" values="
        0 0 0 0 0.05
        0 0 0 0 0.55
        0 0 0 0 1.00
        0 0 0 0.65 0" result="c"/>
      <feMerge>
        <feMergeNode in="c"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <clipPath id="r">
      <rect x="18" y="18" width="220" height="220" rx="56" ry="56"/>
    </clipPath>
  </defs>

  <g clip-path="url(#r)">
    <!-- Base -->
    <rect x="18" y="18" width="220" height="220" rx="56" ry="56" fill="url(#bg)"/>

    <!-- Subtle glass highlight -->
    <path d="M24 54 C70 18 186 18 232 54 L232 78 C186 48 70 48 24 78 Z"
          fill="#FFFFFF" opacity="0.06"/>

    <!-- Neon flame -->
    <path filter="url(#outerGlow)" fill="url(#neon)" d="
      M128 42
      C114 62 124 76 112 90
      C96 108 72 110 68 138
      C64 168 88 188 110 198
      C92 184 94 170 104 158
      C112 148 126 154 132 144
      C138 132 128 120 138 108
      C148 120 138 132 144 144
      C150 154 164 148 172 158
      C182 170 184 184 166 198
      C188 188 212 168 208 138
      C204 110 180 108 164 90
      C152 76 162 62 148 42
      C142 54 138 60 128 68
      C118 60 114 54 128 42 Z"/>

    <!-- Crown silhouette -->
    <g filter="url(#drop)">
      <path d="M72 104 L92 144 L128 118 L164 144 L184 104 L184 160
               C184 178 170 192 152 192 H104
               C86 192 72 178 72 160 Z"
            fill="#0A0F1E" opacity="0.95"/>

      <!-- Crown edge -->
      <path d="M72 104 L92 144 L128 118 L164 144 L184 104"
            fill="none" stroke="url(#edge)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

      <!-- Inner neon rim -->
      <path d="M86 120 L98 142 L128 126 L158 142 L170 120"
            fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

      <!-- Crown jewels -->
      <circle cx="92" cy="144" r="6" fill="url(#neon)" opacity="0.9"/>
      <circle cx="128" cy="118" r="7" fill="url(#neon)" opacity="0.95"/>
      <circle cx="164" cy="144" r="6" fill="url(#neon)" opacity="0.9"/>
    </g>

    <!-- BC monogram -->
    <g filter="url(#outerGlow)">
      <path d="M96 206
               C96 186 112 172 132 172
               C152 172 166 184 166 200
               C166 216 152 228 132 228
               C112 228 96 226 96 206 Z"
            fill="#070A14" opacity="0.55"/>
      <text x="128" y="214" text-anchor="middle"
            font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial"
            font-size="44" font-weight="800"
            fill="url(#edge)" stroke="#001A66" stroke-width="2" paint-order="stroke">
        BC
      </text>
    </g>

    <!-- Border -->
    <rect x="18" y="18" width="220" height="220" rx="56" ry="56"
          fill="none" stroke="#FFFFFF" opacity="0.10" stroke-width="2"/>
  </g>
</svg>
