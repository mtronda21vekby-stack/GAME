    <filter id="miniGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#26E9FF" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg2)"/>

  <!-- simplified flame silhouette (reads tiny) -->
  <g filter="url(#miniGlow)">
    <path d="M128 18
      C106 34, 104 58, 118 74
      C90 90, 78 116, 88 140
      C70 154, 72 180, 92 196
      C104 226, 118 240, 128 242
      C138 240, 152 226, 164 196
      C184 180, 186 154, 168 140
      C178 116, 166 90, 138 74
      C152 58, 150 34, 128 18Z"
      fill="url(#blueFire)"/>

    <!-- bold skull mark (minimal lines) -->
    <path d="M128 78
      C152 78, 170 94, 170 118
      C170 136, 160 148, 148 158
      C146 160, 146 168, 146 174
      C146 194, 138 206, 128 206
      C118 206, 110 194, 110 174
      C110 168, 110 160, 108 158
      C96 148, 86 136, 86 118
      C86 94, 104 78, 128 78Z"
      fill="#0A1220" opacity="0.92"/>

    <!-- eyes (big & readable) -->
    <path d="M104 124
      C110 112, 120 108, 128 108
      C136 108, 146 112, 152 124
      C150 136, 142 140, 136 138
      C132 136, 130 132, 128 130
      C126 132, 124 136, 120 138
      C114 140, 106 136, 104 124Z"
