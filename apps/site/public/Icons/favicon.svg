<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070F"/>
      <stop offset="100%" stop-color="#0B1022"/>
    </linearGradient>

    <!-- Blue Fire -->
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B6F6FF"/>
      <stop offset="40%" stop-color="#2FE3FF"/>
      <stop offset="75%" stop-color="#0E7CFF"/>
      <stop offset="100%" stop-color="#0019FF"/>
    </linearGradient>

    <!-- Metallic Skull -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#B7D7FF"/>
      <stop offset="70%" stop-color="#4FA3FF"/>
      <stop offset="100%" stop-color="#0C3CFF"/>
    </linearGradient>

    <!-- Crown Gold Accent -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2C2"/>
      <stop offset="50%" stop-color="#FFD35A"/>
      <stop offset="100%" stop-color="#B88300"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bg)"/>

  <!-- Blue flame -->
  <path fill="url(#fire)" filter="url(#glow)" d="
    M128 30
    C110 55 120 75 105 95
    C90 115 80 140 95 170
    C108 195 125 210 128 215
    C131 210 148 195 161 170
    C176 140 166 115 151 95
    C136 75 146 55 128 30 Z
  "/>

  <!-- Crown -->
  <path fill="url(#gold)" d="
    M90 90 L105 70 L128 85 L151 70 L166 90
    L156 100 L128 95 L100 100 Z
  "/>

  <!-- Skull -->
  <g fill="url(#metal)">
    <!-- Head -->
    <path d="
      M128 95
      C95 95 80 120 80 145
      C80 170 95 190 128 190
      C161 190 176 170 176 145
      C176 120 161 95 128 95 Z
    "/>

    <!-- Jaw -->
    <rect x="108" y="175" width="40" height="20" rx="6"/>

    <!-- Teeth lines -->
    <line x1="118" y1="178" x2="118" y2="195" stroke="#0B1022" stroke-width="3"/>
    <line x1="128" y1="178" x2="128" y2="195" stroke="#0B1022" stroke-width="3"/>
    <line x1="138" y1="178" x2="138" y2="195" stroke="#0B1022" stroke-width="3"/>

    <!-- Eyes -->
    <polygon points="102,135 118,125 118,145" fill="#0B1022"/>
    <polygon points="154,135 138,125 138,145" fill="#0B1022"/>

    <!-- Nose -->
    <polygon points="128,145 120,160 136,160" fill="#0B1022"/>
  </g>

</svg>
