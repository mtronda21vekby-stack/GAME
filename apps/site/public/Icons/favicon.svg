<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2FE7FF" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#0AA7FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flameA" x1="64" y1="30" x2="192" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7CFFFD"/>
      <stop offset="0.35" stop-color="#16D6FF"/>
      <stop offset="0.7" stop-color="#0A7BFF"/>
      <stop offset="1" stop-color="#0033A6"/>
    </linearGradient>

    <linearGradient id="flameB" x1="52" y1="48" x2="204" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9FFFF"/>
      <stop offset="0.25" stop-color="#4EFBFF"/>
      <stop offset="0.62" stop-color="#10B9FF"/>
      <stop offset="1" stop-color="#004CFF"/>
    </linearGradient>

    <linearGradient id="metal" x1="72" y1="72" x2="184" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6FBFF"/>
      <stop offset="0.22" stop-color="#D7E4EF"/>
      <stop offset="0.5" stop-color="#A9B7C4"/>
      <stop offset="0.78" stop-color="#EEF6FF"/>
      <stop offset="1" stop-color="#8EA0B2"/>
