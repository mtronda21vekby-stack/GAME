<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#12F0FF" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#0A7BFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="blueFire" x1="88" y1="20" x2="168" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CFFFFF"/>
      <stop offset="0.3" stop-color="#37F2FF"/>
      <stop offset="0.62" stop-color="#10A8FF"/>
      <stop offset="1" stop-color="#0032D6"/>
