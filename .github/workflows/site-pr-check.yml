name: Site PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/site/**"
      - "functions/api/commerce/**"
      - "functions/api/_lib/commerce.ts"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/site-pr-check.yml"
  workflow_dispatch:

concurrency:
  group: site-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_BC_EXPERIENCE_MODE: off
      VITE_BC_EXPERIENCE_DEBUG: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate key art
        run: pnpm --filter @blackcrown/site test:assets

      - name: Typecheck site
        run: pnpm --filter @blackcrown/site typecheck

      - name: Unit tests
        run: pnpm --filter @blackcrown/site test

      - name: Install Playwright browsers
        run: pnpm --filter @blackcrown/site exec playwright install --with-deps chromium webkit

      - name: Chromium and WebKit smoke tests
        run: pnpm --filter @blackcrown/site test:e2e

      - name: Build site with lazy Nexus chunks
        run: VITE_BC_EXPERIENCE_MODE=lab pnpm --filter @blackcrown/site build

      - name: Enforce bundle budgets
        run: node apps/site/scripts/check-bundle-budget.mjs

      - name: Build production package
        run: npm run build:prod
