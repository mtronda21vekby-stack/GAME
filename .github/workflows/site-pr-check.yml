name: Site PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/site/**"
      - "functions/api/commerce/**"
      - "functions/api/_lib/commerce.ts"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/site-pr-check.yml"
  workflow_dispatch:

concurrency:
  group: site-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate key art
        run: pnpm --filter @blackcrown/site test:assets

      - name: Typecheck site
        run: pnpm --filter @blackcrown/site typecheck

      - name: Run site unit tests
        run: pnpm --filter @blackcrown/site test

      - name: Install Playwright browsers
        run: pnpm --filter @blackcrown/site exec playwright install --with-deps chromium webkit

      - name: Run site smoke tests
        run: pnpm --filter @blackcrown/site test:e2e

      - name: Build site
        run: pnpm --filter @blackcrown/site build

      - name: Enforce bundle budget
        run: node apps/site/scripts/check-bundle-budget.mjs

      - name: Build production bundle
        run: npm run build:prod

      - name: Check workspace type debt
        id: workspace-typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: Report workspace type debt
        if: steps.workspace-typecheck.outcome == 'failure'
        run: echo "::warning::Workspace typecheck contains errors outside the hard-gated site scope."
