name: Auto Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auto-deploy-cloudflare-pages.yml"
      - "apps/**"
      - "packages/**"
      - "functions/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.4"
  CLOUDFLARE_PROJECT_NAME: siteblcrown
  VITE_BC_EXPERIENCE_MODE: home
  VITE_BC_EXPERIENCE_DEBUG: "0"
  VITE_BC_EXPERIENCE_QUALITY: auto
  VITE_BC_CROWN_ASSET_MODE: auto
  VITE_BC_CROWN_ASSET_OVERRIDE: candidate-b
  VITE_BC_ENVIRONMENT_ASSET_MODE: blender

concurrency:
  group: blackcrown-production-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build production bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commerce trust boundary
        run: node scripts/check-commerce-trust.mjs

      - name: Build production output
        run: pnpm build:prod

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackcrown-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          fi

      - name: Checkout
        if: steps.cloudflare.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Download dist artifact
        if: steps.cloudflare.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: blackcrown-dist
          path: dist

      - name: Deploy production bundle to siteblcrown
        if: steps.cloudflare.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=main --commit-dirty=true
