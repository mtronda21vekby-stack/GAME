name: Auto Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auto-deploy-cloudflare-pages.yml"
      - "apps/**"
      - "packages/**"
      - "functions/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.4"
  WRANGLER_VERSION: "3.90.0"
  CLOUDFLARE_PROJECT_NAME: siteblcrown
  BLACKCROWN_PRODUCTION_URL: "https://blackcrown.work"
  BLACKCROWN_BOT_PRODUCTION_URL: "https://ggbf6-warzon-bot.onrender.com"
  EXPECTED_SITE_BRIDGE_CONTRACT: "blackcrown-account-bridge-v43-direct-supabase"
  EXPECTED_BOT_VERSION: "44.0.0"
  EXPECTED_BOT_RELEASE_CONTRACT: "bco-aaa-war-room-alerts-v44"
  VITE_BC_EXPERIENCE_MODE: home
  VITE_BC_EXPERIENCE_DEBUG: "0"
  VITE_BC_EXPERIENCE_QUALITY: auto
  VITE_BC_CROWN_ASSET_MODE: auto
  VITE_BC_CROWN_ASSET_OVERRIDE: candidate-b
  VITE_BC_ENVIRONMENT_ASSET_MODE: blender

concurrency:
  group: blackcrown-production-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build production bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate commerce trust boundary
        run: node scripts/check-commerce-trust.mjs
      - name: Build production output
        run: pnpm build:prod
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackcrown-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy and verify production
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare production credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Production deploy cannot be verified because Cloudflare credentials are missing."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: blackcrown-dist
          path: dist
      - name: Deploy production bundle to siteblcrown
        shell: bash
        run: >-
          pnpm dlx wrangler@${WRANGLER_VERSION} pages deploy dist
          --project-name=${CLOUDFLARE_PROJECT_NAME}
          --branch=main
          --commit-hash=${GITHUB_SHA}
          --commit-dirty=true
      - name: Production ecosystem smoke gate
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          site=os.environ['BLACKCROWN_PRODUCTION_URL'].rstrip('/')
          bot=os.environ['BLACKCROWN_BOT_PRODUCTION_URL'].rstrip('/')
          expected_site=os.environ['EXPECTED_SITE_BRIDGE_CONTRACT']
          expected_version=os.environ['EXPECTED_BOT_VERSION']
          expected_contract=os.environ['EXPECTED_BOT_RELEASE_CONTRACT']
          headers={'Accept':'application/json','Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'BLACK-CROWN-OPS/production-smoke-v44'}
          def request_json(url):
              req=urllib.request.Request(url,headers=headers,method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      status=response.status; body=response.read().decode('utf-8',errors='replace')
              except urllib.error.HTTPError as exc:
                  status=exc.code; body=exc.read().decode('utf-8',errors='replace')
              try: payload=json.loads(body)
              except Exception: payload=None
              return status,payload,body[:500]
          last_error='not started'
          for attempt in range(1,19):
              try:
                  status,payload,body=request_json(site+'/api/deploy-version')
                  if status != 200 or not isinstance(payload,dict) or payload.get('bridgeContract') != expected_site:
                      raise AssertionError(f'stale site deployment: {status} {body}')
                  status,payload,body=request_json(site+'/api/auth/session/verify')
                  if status != 401 or not isinstance(payload,dict) or payload.get('reason') != 'unauthorized':
                      raise AssertionError(f'session verifier contract mismatch: {status} {body}')
                  status,payload,body=request_json(bot+'/health/details')
                  if status != 200 or not isinstance(payload,dict):
                      raise AssertionError(f'bot health unavailable: {status} {body}')
                  release=payload.get('release')
                  if not isinstance(release,dict) or release.get('version') != expected_version or release.get('contract') != expected_contract:
                      raise AssertionError(f'stale bot release: {body}')
                  print('production ecosystem smoke: clean',f'site_contract={expected_site}',f'bot_version={expected_version}',f'bot_contract={expected_contract}')
                  break
              except Exception as exc:
                  last_error=f'attempt {attempt}/18: {type(exc).__name__}: {exc}'
                  print(last_error)
                  if attempt == 18: raise SystemExit(f'Production ecosystem smoke failed: {last_error}')
                  time.sleep(10)
          PY
