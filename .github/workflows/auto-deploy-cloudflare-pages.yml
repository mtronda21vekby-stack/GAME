name: Auto Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auto-deploy-cloudflare-pages.yml"
      - "apps/**"
      - "packages/**"
      - "functions/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.4"
  WRANGLER_VERSION: "3.90.0"
  CLOUDFLARE_PROJECT_NAME: siteblcrown
  BLACKCROWN_PRODUCTION_URL: "https://blackcrown.work"
  BLACKCROWN_BOT_PRODUCTION_URL: "https://ggbf6-warzon-bot.onrender.com"
  EXPECTED_BOT_VERSION: "41.1.0"
  EXPECTED_BOT_RELEASE_CONTRACT: "bco-lightweight-site-session-verify-v41.1"
  VITE_BC_EXPERIENCE_MODE: home
  VITE_BC_EXPERIENCE_DEBUG: "0"
  VITE_BC_EXPERIENCE_QUALITY: auto
  VITE_BC_CROWN_ASSET_MODE: auto
  VITE_BC_CROWN_ASSET_OVERRIDE: candidate-b
  VITE_BC_ENVIRONMENT_ASSET_MODE: blender

concurrency:
  group: blackcrown-production-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build production bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commerce trust boundary
        run: node scripts/check-commerce-trust.mjs

      - name: Build production output
        run: pnpm build:prod

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackcrown-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy and verify production
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare production credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Production deploy cannot be verified because Cloudflare credentials are missing."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: blackcrown-dist
          path: dist

      - name: Deploy production bundle to siteblcrown
        shell: bash
        run: >-
          pnpm dlx wrangler@${WRANGLER_VERSION} pages deploy dist
          --project-name=${CLOUDFLARE_PROJECT_NAME}
          --branch=main
          --commit-hash=${GITHUB_SHA}
          --commit-dirty=true

      - name: Production ecosystem smoke gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          site = os.environ["BLACKCROWN_PRODUCTION_URL"].rstrip("/")
          bot = os.environ["BLACKCROWN_BOT_PRODUCTION_URL"].rstrip("/")
          expected_version = os.environ["EXPECTED_BOT_VERSION"]
          expected_contract = os.environ["EXPECTED_BOT_RELEASE_CONTRACT"]
          headers = {
              "Accept": "application/json",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
              "User-Agent": "BLACK-CROWN-OPS/production-smoke-v41",
          }

          def request_json(url: str):
              req = urllib.request.Request(url, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      status = response.status
                      body = response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  body = exc.read().decode("utf-8", errors="replace")
              try:
                  payload = json.loads(body)
              except Exception:
                  payload = None
              return status, payload, body[:500]

          last_error = "not started"
          for attempt in range(1, 19):
              try:
                  # Public site must be reachable after the Pages deployment.
                  req = urllib.request.Request(
                      site + "/",
                      headers={**headers, "Accept": "text/html,*/*"},
                      method="GET",
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      if response.status != 200:
                          raise AssertionError(f"site root status={response.status}")

                  # The lightweight verifier must exist in production and fail closed
                  # without a signed bc_session cookie.
                  verify_status, verify_payload, verify_body = request_json(site + "/api/auth/session/verify")
                  if verify_status != 401:
                      raise AssertionError(
                          f"session verifier expected 401, got {verify_status}: {verify_body}"
                      )
                  if not isinstance(verify_payload, dict) or verify_payload.get("reason") != "unauthorized":
                      raise AssertionError(f"session verifier contract mismatch: {verify_body}")

                  # Render must be the exact release paired with this site bridge.
                  bot_status, bot_payload, bot_body = request_json(bot + "/health/details")
                  if bot_status != 200 or not isinstance(bot_payload, dict):
                      raise AssertionError(f"bot health unavailable: {bot_status} {bot_body}")
                  release = bot_payload.get("release")
                  if not isinstance(release, dict):
                      raise AssertionError(f"bot release metadata missing: {bot_body}")
                  if release.get("version") != expected_version:
                      raise AssertionError(
                          f"stale bot version {release.get('version')!r}; expected {expected_version!r}"
                      )
                  if release.get("contract") != expected_contract:
                      raise AssertionError(
                          f"stale bot contract {release.get('contract')!r}; expected {expected_contract!r}"
                      )

                  # The bridge route itself must be deployed and fail closed without identity.
                  bridge_status, bridge_payload, bridge_body = request_json(
                      bot + "/integrations/site/telegram/status"
                  )
                  if bridge_status != 401:
                      raise AssertionError(
                          f"bot bridge expected 401, got {bridge_status}: {bridge_body}"
                      )
                  if not isinstance(bridge_payload, dict) or bridge_payload.get("reason") != "auth_required":
                      raise AssertionError(f"bot bridge contract mismatch: {bridge_body}")

                  print(
                      "production ecosystem smoke: clean",
                      f"site={site}",
                      f"bot_version={expected_version}",
                      f"contract={expected_contract}",
                  )
                  break
              except Exception as exc:
                  last_error = f"attempt {attempt}/18: {type(exc).__name__}: {exc}"
                  print(last_error)
                  if attempt == 18:
                      raise SystemExit(f"Production ecosystem smoke failed: {last_error}")
                  time.sleep(10)
          PY
