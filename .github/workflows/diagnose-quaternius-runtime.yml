name: Diagnose Quaternius Unity runtime

on:
  push:
    branches:
      - feature/crown-front-art-reboot-hero-frame
    paths:
      - .github/workflows/diagnose-quaternius-runtime.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: "30909953432"
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: feature/crown-front-art-reboot-hero-frame
          fetch-depth: 0

      - name: Extract exact Unity failure
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/full.log || true
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('/tmp/full.log').read_text(encoding='utf-8', errors='replace')
          patterns = (
              r'error CS\d+.*',
              r'Assets/.*?\(\d+,\d+\):.*',
              r'\b(?:InvalidOperationException|TargetInvocationException|DirectoryNotFoundException|ArgumentException|NullReferenceException|MissingReferenceException|IndexOutOfRangeException|KeyNotFoundException|UnityException)\b.*',
              r'^Exception:.*',
              r'Quaternius.*(?:missing|failed|error|exception).*',
              r'Resources/.*(?:missing|not found).*',
              r'Aborting batchmode.*',
              r'executeMethod.*',
              r'BuildFailedException.*',
              r'Error building Player.*',
          )

          raw_lines = text.splitlines()
          selected = []
          for index, raw in enumerate(raw_lines):
              clean = re.sub(r'^.*?Z\s+', '', raw).rstrip()
              if any(re.search(pattern, clean, re.I) for pattern in patterns):
                  start = max(0, index - 2)
                  end = min(len(raw_lines), index + 8)
                  for context_raw in raw_lines[start:end]:
                      context = re.sub(r'^.*?Z\s+', '', context_raw).rstrip()
                      if context and context not in selected:
                          selected.append(context)

          if not selected:
              selected = [re.sub(r'^.*?Z\s+', '', line).rstrip() for line in raw_lines[-180:] if line.strip()]

          summary = '\n'.join(selected[-220:])
          Path('/tmp/summary.txt').write_text(summary, encoding='utf-8')
          print(summary)
          PY

      - name: Comment diagnostic on PR
        shell: bash
        run: |
          {
            echo '## Quaternius Unity runtime diagnostic'
            echo
            echo '```text'
            cat /tmp/summary.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment 28 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Remove one-shot diagnostic workflow
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/crown-front-art-reboot-hero-frame'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-quaternius-runtime.yml
          git commit -m 'chore: remove Quaternius runtime diagnostic'

          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
