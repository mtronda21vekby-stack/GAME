name: Inventory Quaternius CC0 sci-fi assets

on:
  push:
    branches:
      - feature/crown-front-art-reboot-hero-frame
    paths:
      - .github/workflows/inventory-quaternius-scifi.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/crown-front-art-reboot-hero-frame
          fetch-depth: 0

      - name: Read remote ZIP directories and build inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unity/crown-front/AssetResearch
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import urllib.request

          archives = [
              ('Sci-Fi Essentials Models', 'https://opengameart.org/sites/default/files/sci-fi_essentials_kit_models.zip', 'https://opengameart.org/content/sci-fi-essentials-kit'),
              ('Sci-Fi Essentials Textures', 'https://opengameart.org/sites/default/files/sci-fi_essentials_kit_textures.zip', 'https://opengameart.org/content/sci-fi-essentials-kit'),
              ('Ultimate Space Kit GLB', 'https://opengameart.org/sites/default/files/ultimate_space_kit-glb.zip', 'https://opengameart.org/content/ultimate-space-kit-by-quaternius'),
          ]

          def ranged(url, start, end):
              request = urllib.request.Request(url, headers={
                  'Range': f'bytes={start}-{end}',
                  'User-Agent': 'CROWN-FRONT-asset-inventory/1.0',
              })
              with urllib.request.urlopen(request, timeout=120) as response:
                  return response.read(), response.headers, response.status

          def remote_zip_names(url):
              first, headers, status = ranged(url, 0, 0)
              content_range = headers.get('Content-Range', '')
              if '/' in content_range:
                  size = int(content_range.rsplit('/', 1)[1])
              else:
                  size = int(headers.get('Content-Length', len(first)))

              tail_size = min(size, 262144)
              tail, _, tail_status = ranged(url, size - tail_size, size - 1)
              if tail_status == 200 and len(tail) == size:
                  archive = tail
                  tail_base = 0
              else:
                  archive = None
                  tail_base = size - len(tail)

              marker = tail.rfind(b'PK\x05\x06')
              if marker < 0:
                  raise RuntimeError(f'EOCD not found for {url}; size={size}; tail={len(tail)}')
              eocd = tail[marker:marker + 22]
              if len(eocd) < 22:
                  raise RuntimeError(f'Truncated EOCD for {url}')
              _, disk, cd_disk, entries_disk, entries_total, cd_size, cd_offset, comment_len = struct.unpack('<4s4H2LH', eocd)
              if disk != 0 or cd_disk != 0 or entries_disk != entries_total:
                  raise RuntimeError(f'Multi-disk ZIP is unsupported: {url}')

              if archive is not None:
                  central = archive[cd_offset:cd_offset + cd_size]
              else:
                  central, _, _ = ranged(url, cd_offset, cd_offset + cd_size - 1)
                  if len(central) != cd_size:
                      raise RuntimeError(f'Central directory length mismatch for {url}: {len(central)} != {cd_size}')

              names = []
              position = 0
              while position < len(central):
                  if central[position:position + 4] != b'PK\x01\x02':
                      raise RuntimeError(f'Bad central-directory signature at {position} for {url}')
                  header = central[position:position + 46]
                  flags = struct.unpack_from('<H', header, 8)[0]
                  filename_len = struct.unpack_from('<H', header, 28)[0]
                  extra_len = struct.unpack_from('<H', header, 30)[0]
                  comment_len = struct.unpack_from('<H', header, 32)[0]
                  start = position + 46
                  raw_name = central[start:start + filename_len]
                  encoding = 'utf-8' if flags & 0x800 else 'cp437'
                  names.append(raw_name.decode(encoding, errors='replace'))
                  position = start + filename_len + extra_len + comment_len

              if len(names) != entries_total:
                  raise RuntimeError(f'Entry count mismatch for {url}: {len(names)} != {entries_total}')
              return size, names

          terms = (
              'robot', 'mech', 'enemy', 'turret', 'gun', 'rifle', 'weapon',
              'platform', 'floor', 'wall', 'door', 'column', 'crate', 'screen',
              'generator', 'reactor', 'console', 'hologram', 'ship', 'drone',
              'armor', 'tank', 'bridge', 'pipe', 'engine', 'core', 'station'
          )
          model_ext = ('.fbx', '.obj', '.glb', '.gltf', '.blend')
          texture_ext = ('.png', '.jpg', '.jpeg', '.tga')
          lines = [
              '# Quaternius CC0 sci-fi inventory',
              '',
              'Generated from public OpenGameArt CC0 archive directories.',
              'The archives themselves are not committed.',
              '',
          ]

          for title, url, source in archives:
              size, names = remote_zip_names(url)
              files = sorted(name for name in names if not name.endswith('/'))
              models = [name for name in files if name.lower().endswith(model_ext)]
              textures = [name for name in files if name.lower().endswith(texture_ext)]
              candidates = [name for name in files if any(term in name.lower() for term in terms)]
              lines.extend([
                  f'## {title}', '',
                  f'- Source: {source}',
                  f'- Archive URL: {url}',
                  f'- Archive bytes: {size}',
                  f'- Files: {len(files)}',
                  f'- Models: {len(models)}',
                  f'- Textures: {len(textures)}', '',
                  '### Candidate files', '',
              ])
              lines.extend(f'- `{name}`' for name in candidates)
              lines.extend(['', '### All model files', ''])
              lines.extend(f'- `{name}`' for name in models)
              lines.append('')

          output = Path('unity/crown-front/AssetResearch/QUATERNIUS_CC0_INVENTORY.md')
          output.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'Wrote {output} ({output.stat().st_size} bytes)')
          PY

          git rm .github/workflows/inventory-quaternius-scifi.yml

      - name: Commit and push with race-safe rebase
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/crown-front-art-reboot-hero-frame'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unity/crown-front/AssetResearch/QUATERNIUS_CC0_INVENTORY.md
          git commit -m 'docs: inventory Quaternius CC0 sci-fi assets'

          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying."
            sleep $((attempt * 2))
          done
          echo 'Failed to push inventory after four rebased attempts.' >&2
          exit 1
