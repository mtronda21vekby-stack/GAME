name: Fix Quaternius Unity Space namespace

on:
  push:
    branches:
      - feature/crown-front-art-reboot-hero-frame
    paths:
      - .github/workflows/fix-quaternius-space-namespace.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/crown-front-art-reboot-hero-frame
          fetch-depth: 0

      - name: Qualify UnityEngine Space enum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('unity/crown-front/Assets/_Project/Runtime/CrownQuaterniusArtReboot.cs')
          text = path.read_text(encoding='utf-8')
          before_self = text.count('Space.Self')
          before_world = text.count('Space.World')
          if before_self + before_world < 1:
              raise SystemExit('No unqualified Unity Space enum references were found')

          text = text.replace('Space.Self', 'UnityEngine.Space.Self')
          text = text.replace('Space.World', 'UnityEngine.Space.World')

          if 'Space.Self' in text.replace('UnityEngine.Space.Self', ''):
              raise SystemExit('An unqualified Space.Self reference remains')
          if 'Space.World' in text.replace('UnityEngine.Space.World', ''):
              raise SystemExit('An unqualified Space.World reference remains')

          path.write_text(text, encoding='utf-8')
          print(f'Qualified {before_self} Space.Self and {before_world} Space.World references')
          PY

          git rm .github/workflows/fix-quaternius-space-namespace.yml

      - name: Commit and push namespace repair
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/crown-front-art-reboot-hero-frame'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unity/crown-front/Assets/_Project/Runtime/CrownQuaterniusArtReboot.cs
          git diff --cached --check
          git commit -m 'fix: qualify Unity Space enum in Quaternius presentation'

          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying."
            sleep $((attempt * 2))
          done
          exit 1
