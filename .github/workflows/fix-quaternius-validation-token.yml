name: Fix Quaternius validation token

on:
  push:
    branches:
      - feature/crown-front-art-reboot-hero-frame
    paths:
      - .github/workflows/fix-quaternius-validation-token.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/crown-front-art-reboot-hero-frame
          fetch-depth: 0

      - name: Rename local mount variables and verify source scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('unity/crown-front/Assets/_Project/Runtime/CrownQuaterniusArtReboot.cs')
          text = path.read_text(encoding='utf-8')

          forbidden = [
              'REACTOR DORMANT',
              'REACTOR OFFLINE',
              'ORDER // DEPLOY A SQUAD',
              'DEPLOY TO LANE',
              'PUSH',
              'HOLD',
              'FLANK',
          ]

          matches_before = {}
          upper = text.upper()
          for token in forbidden:
              positions = [match.start() for match in re.finditer(re.escape(token), upper)]
              if positions:
                  matches_before[token] = positions

          print('Forbidden-token matches before:', matches_before)
          if 'HOLD' not in matches_before:
              raise SystemExit('Expected false-positive HOLD token was not found')

          text = re.sub(r'\bholderObject\b', 'mountObject', text)
          text = re.sub(r'\bholder\b', 'mount', text)
          path.write_text(text, encoding='utf-8')

          upper = text.upper()
          remaining = {}
          for token in forbidden:
              positions = [match.start() for match in re.finditer(re.escape(token), upper)]
              if positions:
                  remaining[token] = positions

          if remaining:
              for token, positions in remaining.items():
                  for position in positions:
                      start = max(0, position - 80)
                      end = min(len(text), position + len(token) + 80)
                      print(f'{token}: {text[start:end]!r}')
              raise SystemExit(f'Forbidden HUD tokens remain in Quaternius runtime: {remaining}')

          print('Quaternius runtime passes the exact source-token scan.')
          PY

          git rm .github/workflows/fix-quaternius-validation-token.yml

      - name: Commit and push token repair
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/crown-front-art-reboot-hero-frame'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unity/crown-front/Assets/_Project/Runtime/CrownQuaterniusArtReboot.cs
          git diff --cached --check
          git commit -m 'fix: remove false HUD token from Quaternius runtime'

          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin "HEAD:$branch"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
