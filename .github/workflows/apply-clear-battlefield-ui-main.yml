name: Temporary battlefield UI source patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-feature-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/clear-battlefield-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/clear-battlefield-ui
          fetch-depth: 0

      - name: Load patch helper from main
        shell: bash
        run: git show origin/main:.github/scripts/patch-clear-battlefield-ui.py > /tmp/patch-clear-battlefield-ui.py

      - name: Remove obstructive center controls
        run: python3 /tmp/patch-clear-battlefield-ui.py

      - name: Commit source change when needed
        shell: bash
        run: |
          if git diff --quiet -- unity/crown-front/Assets/_Project/Runtime/CrownEngineGame.cs; then
            echo "Source already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unity/crown-front/Assets/_Project/Runtime/CrownEngineGame.cs
          git diff --cached --check
          git commit -m "fix: clear center battlefield UI"
          git push origin HEAD:feature/clear-battlefield-ui
