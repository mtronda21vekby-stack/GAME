name: Import Kenney Art Reboot assets v2

on:
  push:
    branches:
      - feature/crown-front-art-reboot-hero-frame
    paths:
      - .github/workflows/import-kenney-art-reboot-assets-v2.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/crown-front-art-reboot-hero-frame
          fetch-depth: 0

      - name: Download and extract selected official CC0 models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kenney
          curl -fL --retry 4 --retry-delay 2 'https://www.kenney.nl/media/pages/assets/space-kit/20874c75ac-1677698978/kenney_space-kit.zip' -o /tmp/kenney/space.zip
          curl -fL --retry 4 --retry-delay 2 'https://kenney.nl/media/pages/assets/factory-kit/edaac9d4f6-1777639602/kenney_factory-kit_3.0.zip' -o /tmp/kenney/factory.zip

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          root = Path('unity/crown-front/Assets/Resources/CrownArt')
          selections = {
              Path('/tmp/kenney/space.zip'): (root / 'SpaceKit', [
                  'astronautA.fbx','astronautB.fbx','turret_double.fbx','turret_single.fbx',
                  'weapon_gun.fbx','weapon_rifle.fbx','machine_generator.fbx','machine_generatorLarge.fbx',
                  'machine_wireless.fbx','machine_wirelessCable.fbx','platform_center.fbx','platform_large.fbx',
                  'platform_long.fbx','platform_side.fbx','platform_cornerRound.fbx','corridor_wall.fbx',
                  'corridor_wallCorner.fbx','pipe_straight.fbx','pipe_cornerRoundLarge.fbx','pipe_ringHigh.fbx',
                  'satelliteDish_detailed.fbx']),
              Path('/tmp/kenney/factory.zip'): (root / 'FactoryKit', [
                  'machine.fbx','machine-fortified.fbx','machine-bed.fbx','robot-arm-a.fbx','robot-arm-b.fbx',
                  'pipe-large.fbx','pipe-large-bend.fbx','pipe-large-junction.fbx','screen-panel-wide.fbx',
                  'screen-panel-small.fbx','structure-wall.fbx']),
          }

          imported=[]; licenses=[]
          for archive,(destination,wanted) in selections.items():
              destination.mkdir(parents=True,exist_ok=True)
              with zipfile.ZipFile(archive) as zf:
                  names=zf.namelist()
                  for filename in wanted:
                      matches=[n for n in names if n.endswith('/FBX format/'+filename)]
                      if len(matches)!=1: raise SystemExit(f'Cannot resolve {filename}: {matches}')
                      target=destination/filename
                      with zf.open(matches[0]) as src,target.open('wb') as dst: shutil.copyfileobj(src,dst)
                      imported.append(str(target))
                  license_names=[n for n in names if n.lower().endswith('license.txt')]
                  if not license_names: raise SystemExit(f'License missing in {archive}')
                  licenses.append(zf.read(license_names[0]).decode('utf-8',errors='replace').strip())

          (root/'IMPORTED_MODELS.md').write_text('# Imported CC0 models\n\n'+'\n'.join(f'- `{p}`' for p in imported)+'\n',encoding='utf-8')
          Path('unity/crown-front/THIRD_PARTY_NOTICES.md').write_text(
              '# Third-party notices\n\n## Kenney Space Kit\n\n- Source: https://www.kenney.nl/assets/space-kit\n- License: CC0 1.0\n\n'
              '## Kenney Factory Kit\n\n- Source: https://kenney.nl/assets/factory-kit\n- License: CC0 1.0\n\n'
              'Selected FBX source models are stored under `Assets/Resources/CrownArt/`.\n\n'
              '### Pack license text\n\n```text\n'+'\n\n'.join(licenses)+'\n```\n',encoding='utf-8')
          print(f'Imported {len(imported)} FBX files')
          PY

          git rm .github/workflows/import-kenney-art-reboot-assets-v2.yml
          git rm -f .github/workflows/import-kenney-art-reboot-assets.yml || true
          git rm -f .github/workflows/diagnose-kenney-import.yml || true

      - name: Commit source assets without text-whitespace validation on ASCII FBX
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unity/crown-front/Assets/Resources/CrownArt unity/crown-front/THIRD_PARTY_NOTICES.md
          git commit -m "feat: import selected Kenney CC0 Art Reboot models"
          git push origin HEAD:feature/crown-front-art-reboot-hero-frame
