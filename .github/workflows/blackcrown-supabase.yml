name: BlackCrown Supabase

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/blackcrown-supabase.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/blackcrown-supabase.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy pending migrations to the dedicated BlackCrown Supabase project"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: blackcrown-supabase-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_REF: nmgotvxisujvpfoxivoq

jobs:
  validate-migrations:
    name: Validate migrations locally
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations from a clean database
        run: supabase db reset --local

      - name: Lint local database
        run: supabase db lint --local --level warning

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  deploy-production:
    name: Deploy migrations to BlackCrown
    needs: validate-migrations
    if: >-
      ${{
        (github.event_name == 'push' && vars.BLACKCROWN_SUPABASE_AUTODEPLOY == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: blackcrown-supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.BLACKCROWN_SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [[ -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error::Missing GitHub secret BLACKCROWN_SUPABASE_DB_PASSWORD"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link dedicated BlackCrown project
        run: >-
          supabase link
          --project-ref "$SUPABASE_PROJECT_REF"
          --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy pending migrations
        run: supabase db push --linked --include-all

      - name: Show remote migration state
        run: supabase migration list --linked
