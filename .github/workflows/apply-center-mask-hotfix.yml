name: Apply CROWN FRONT center mask hotfix

on:
  push:
    branches:
      - hotfix/hide-old-center-ui
    paths:
      - .github/workflows/apply-center-mask-hotfix.yml

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/hide-old-center-ui
          fetch-depth: 0

      - name: Add temporary battlefield cleanup layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('apps/site/public/games/crown-front/index.html')
          css_path = Path('apps/site/public/games/crown-front/TemplateData/style.css')
          html = html_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          marker = '      <canvas id="unity-canvas" width="540" height="960" tabindex="0" aria-label="CROWN FRONT game"></canvas>\n'
          insertion = marker + '''      <div id="battlefield-cleanup-mask" aria-hidden="true">
        <div class="battlefield-cleanup-plate"></div>
      </div>
'''
          if 'id="battlefield-cleanup-mask"' not in html:
              if marker not in html:
                  raise SystemExit('Unity canvas marker not found')
              html = html.replace(marker, insertion, 1)

          styles = r'''

/* Temporary public-build hotfix: conceal the obsolete central reactor/order controls until the
   corrected Unity WebGL binary can be rebuilt. The layer is aligned to the 9:16 Unity canvas and
   blocks the obsolete controls from receiving taps. */
#battlefield-cleanup-mask {
  position: absolute;
  z-index: 2;
  width: auto;
  height: 100%;
  max-width: 100%;
  aspect-ratio: 9 / 16;
  pointer-events: none;
  opacity: 0;
  transition: opacity .18s ease;
}

#unity-canvas.ready + #battlefield-cleanup-mask { opacity: 1; }

.battlefield-cleanup-plate {
  position: absolute;
  top: 28.1%;
  left: 8.5%;
  right: 8.5%;
  height: 14.6%;
  overflow: hidden;
  pointer-events: auto;
  touch-action: none;
  border-top: 1px solid rgba(65, 220, 255, .24);
  border-bottom: 1px solid rgba(65, 220, 255, .18);
  background:
    linear-gradient(90deg,
      transparent 0 31.8%, rgba(54, 218, 255, .16) 32%, transparent 32.4% 66.2%,
      rgba(54, 218, 255, .14) 66.5%, transparent 66.9%),
    repeating-linear-gradient(0deg,
      rgba(255,255,255,.018) 0 1px, transparent 1px 17px),
    linear-gradient(180deg, rgba(12, 23, 31, .98), rgba(5, 12, 18, .99));
  box-shadow:
    inset 0 18px 28px rgba(0,0,0,.34),
    inset 0 -18px 28px rgba(0,0,0,.36),
    0 0 24px rgba(0,0,0,.30);
}

.battlefield-cleanup-plate::before,
.battlefield-cleanup-plate::after {
  content: "";
  position: absolute;
  top: 7%;
  bottom: 7%;
  width: 29%;
  border: 1px solid rgba(49, 220, 255, .12);
  background:
    linear-gradient(135deg, transparent 0 46%, rgba(49,220,255,.06) 47% 49%, transparent 50%),
    linear-gradient(225deg, transparent 0 46%, rgba(255,111,33,.05) 47% 49%, transparent 50%),
    rgba(5, 13, 20, .46);
}

.battlefield-cleanup-plate::before { left: 1.5%; }
.battlefield-cleanup-plate::after { right: 1.5%; }
'''
          if '#battlefield-cleanup-mask {' not in css:
              css += styles

          html_path.write_text(html, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site/public/games/crown-front/index.html apps/site/public/games/crown-front/TemplateData/style.css
          git diff --cached --check
          git commit -m "fix: hide obsolete CROWN FRONT center controls"
          git push origin HEAD:hotfix/hide-old-center-ui
