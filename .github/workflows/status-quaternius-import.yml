name: Status Quaternius import

on:
  push:
    branches:
      - feature/crown-front-art-reboot-hero-frame
    paths:
      - .github/workflows/status-quaternius-import.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/crown-front-art-reboot-hero-frame
          fetch-depth: 0

      - name: Report current import run
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'Import focused Quaternius CC0 review kit' --branch feature/crown-front-art-reboot-hero-frame --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            summary='No Quaternius import run found.'
          else
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url,jobs > /tmp/status.json
            summary="$(cat /tmp/status.json)"
          fi
          {
            echo '## Quaternius import status'
            echo
            echo '```json'
            echo "$summary"
            echo '```'
          } > /tmp/comment.md
          gh pr comment 28 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Remove one-shot status workflow
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/crown-front-art-reboot-hero-frame'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/status-quaternius-import.yml
          git commit -m 'chore: remove Quaternius import status workflow'
          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin "HEAD:$branch"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
