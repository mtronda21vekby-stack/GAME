name: One-shot CROWN FRONT CSS cache bust

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bust-crown-front-css-cache.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Version public player stylesheet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/site/public/games/crown-front/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('href="TemplateData/style.css"', 'href="TemplateData/style.css?v=2"', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/bust-crown-front-css-cache.yml

      - name: Commit cache bust
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/site/public/games/crown-front/index.html
          git diff --cached --check
          git commit -m "fix: refresh CROWN FRONT public stylesheet"
          git push origin HEAD:main
