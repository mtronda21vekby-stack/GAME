name: Diagnose Art Reboot Unity build

on:
  push:
    branches:
      - feature/crown-front-art-reboot-hero-frame
    paths:
      - .github/workflows/diagnose-art-reboot-build.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: "30879858040"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/crown-front-art-reboot-hero-frame
          fetch-depth: 0

      - name: Extract failed Unity log
        shell: bash
        run: |
          gh run view "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/full.log || true
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('/tmp/full.log').read_text(encoding='utf-8', errors='replace')
          patterns = (
              r'error CS\d+.*',
              r'\b(?:InvalidOperationException|TargetInvocationException|DirectoryNotFoundException|ArgumentException|NullReferenceException|MissingReferenceException)\b.*',
              r'Assets/.*?\(\d+,\d+\):.*',
              r'executeMethod.*',
              r'Aborting batchmode.*',
              r'BuildFailedException.*',
              r'Error building Player.*',
              r'Exception:.*',
          )
          lines = []
          for raw in text.splitlines():
              clean = re.sub(r'^.*?Z\s+', '', raw)
              if any(re.search(pattern, clean, re.I) for pattern in patterns):
                  if clean not in lines:
                      lines.append(clean)
          if not lines:
              lines = text.splitlines()[-120:]
          summary = '\n'.join(lines[-120:])
          Path('/tmp/summary.txt').write_text(summary, encoding='utf-8')
          PY

      - name: Comment diagnostic on PR
        shell: bash
        run: |
          {
            echo '## Unity Art Reboot build diagnostic'
            echo
            echo '```text'
            cat /tmp/summary.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment 28 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Remove one-shot diagnostic workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-art-reboot-build.yml
          git commit -m "chore: remove Art Reboot build diagnostic"
          git push origin HEAD:feature/crown-front-art-reboot-hero-frame
