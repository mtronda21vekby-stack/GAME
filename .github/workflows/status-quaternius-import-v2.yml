name: Status repaired Quaternius import

on:
  push:
    branches:
      - feature/crown-front-art-reboot-hero-frame
    paths:
      - .github/workflows/status-quaternius-import-v2.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/crown-front-art-reboot-hero-frame
          fetch-depth: 0

      - name: Wait for conversion and report exact result
        shell: bash
        run: |
          set -euo pipefail
          sleep 180
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'Import focused Quaternius CC0 review kit' --branch feature/crown-front-art-reboot-hero-frame --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [[ -z "$run_id" || "$run_id" == "null" ]]; then
            echo '{"error":"No repaired import run found"}' > /tmp/status.json
          else
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url,jobs > /tmp/status.json
            if [[ "$(jq -r '.conclusion // ""' /tmp/status.json)" == "failure" ]]; then
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failure.log || true
            fi
          fi
          {
            echo '## Repaired Quaternius import status'
            echo
            echo '```json'
            cat /tmp/status.json
            echo '```'
            if [[ -s /tmp/failure.log ]]; then
              echo
              echo '```text'
              tail -n 120 /tmp/failure.log
              echo '```'
            fi
          } > /tmp/comment.md
          gh pr comment 28 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Remove one-shot status workflow
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/crown-front-art-reboot-hero-frame'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/status-quaternius-import-v2.yml
          git commit -m 'chore: remove repaired Quaternius import status workflow'
          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin "HEAD:$branch"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
