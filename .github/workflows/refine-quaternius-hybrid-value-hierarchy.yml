name: Refine Quaternius hybrid value hierarchy

on:
  push:
    branches:
      - feature/crown-front-art-reboot-hero-frame
    paths:
      - .github/workflows/refine-quaternius-hybrid-value-hierarchy.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/crown-front-art-reboot-hero-frame
          fetch-depth: 0

      - name: Apply value hierarchy and evidence fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('unity/crown-front/Assets/_Project/Runtime/CrownQuaterniusHybridPolish.cs')
          text = runtime.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one exact match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '            AddMaterial("blueArmor", new Color(0.025f, 0.22f, 0.56f), 0.72f, 0.62f, new Color(0f, 0.09f, 0.34f));',
              '            AddMaterial("blueArmor", new Color(0.045f, 0.105f, 0.18f), 0.84f, 0.56f, new Color(0f, 0.018f, 0.055f));',
              'blue armor value')
          replace_once(
              '            AddMaterial("redArmor", new Color(0.54f, 0.038f, 0.016f), 0.74f, 0.58f, new Color(0.34f, 0.01f, 0f));',
              '            AddMaterial("redArmor", new Color(0.18f, 0.065f, 0.045f), 0.84f, 0.54f, new Color(0.055f, 0.006f, 0f));',
              'red armor value')

          replace_once(
              '            if (path.IndexOf("Shield Arm Route", StringComparison.OrdinalIgnoreCase) >= 0 && ContainsAny(path, "Shield Rib")) return _materials["blueArmor"];',
              '            if (path.IndexOf("Shield Arm Route", StringComparison.OrdinalIgnoreCase) >= 0 && ContainsAny(path, "Shield Rib")) return _materials["steel"];',
              'shield route material')
          replace_once(
              '            if (path.IndexOf("Blade Arm Route", StringComparison.OrdinalIgnoreCase) >= 0 && ContainsAny(path, "Blade Plate")) return _materials["redArmor"];',
              '            if (path.IndexOf("Blade Arm Route", StringComparison.OrdinalIgnoreCase) >= 0 && ContainsAny(path, "Blade Plate")) return _materials["graphite"];',
              'blade route material')
          replace_once(
              '                if (ContainsAny(path, "Left Shoulder Fortress")) material = _materials["blueArmor"];\n                else if (ContainsAny(path, "Right Shoulder Fortress")) material = _materials["redArmor"];',
              '                if (ContainsAny(path, "Left Shoulder Fortress", "Right Shoulder Fortress")) material = _materials["steel"];',
              'shoulder fortress material')

          replace_once('                lens.localScale = Vector3.one * 0.48f;', '                lens.localScale = Vector3.one * 0.30f;', 'core lens scale')
          replace_once('                lens.localPosition = new Vector3(0f, 1.15f, 0f);', '                lens.localPosition = new Vector3(0f, 1.04f, 0f);', 'core lens position')
          replace_once('                dome.localScale = new Vector3(0.82f, 0.62f, 0.82f);', '                dome.localScale = new Vector3(0.72f, 0.50f, 0.72f);', 'core dome scale')
          replace_once('            if (baseModel != null) baseModel.localScale = new Vector3(0.86f, 0.72f, 0.86f);', '            if (baseModel != null) baseModel.localScale = new Vector3(0.76f, 0.62f, 0.76f);', 'core base scale')
          replace_once(
              '            Transform oldCenter = FindDeep(root, "Reactor White Center");\n            if (oldCenter != null) oldCenter.gameObject.SetActive(false);',
              '            Transform oldCenter = FindDeep(root, "Reactor White Center");\n            if (oldCenter != null) oldCenter.gameObject.SetActive(false);\n            Transform oldStabilizers = FindDeep(root, "Reactor Stabilizers");\n            if (oldStabilizers != null) oldStabilizers.gameObject.SetActive(false);',
              'disable legacy core details')
          replace_once(
              '            Part("Outer Magnetic Ring", polish, _ring, new Vector3(0f, 1.20f, 0f), new Vector3(1.78f, 1.78f, 1.78f), armor, new Vector3(62f, 0f, 0f));',
              '            Part("Outer Magnetic Ring", polish, _ring, new Vector3(0f, 1.08f, 0f), new Vector3(1.26f, 1.26f, 1.26f), _materials["edge"], new Vector3(62f, 0f, 0f));',
              'outer core ring')
          replace_once(
              '            Part("Inner Magnetic Ring", polish, _ring, new Vector3(0f, 1.20f, 0f), new Vector3(1.28f, 1.28f, 1.28f), _materials["edge"], new Vector3(-48f, 0f, 0f));\n',
              '',
              'remove inner core ring')
          replace_once(
              '            Part("Focused Reactor Core", polish, _blade, new Vector3(0f, 1.22f, 0f), new Vector3(0.34f, 0.96f, 0.34f), _materials["whiteEnergy"]);',
              '            Part("Focused Reactor Core", polish, _blade, new Vector3(0f, 1.08f, 0f), new Vector3(0.26f, 0.82f, 0.26f), _materials["whiteEnergy"]);',
              'focused core scale')
          replace_once(
              '                Vector3 position = new Vector3(Mathf.Sin(radians) * 1.92f, 0.68f, Mathf.Cos(radians) * 1.92f);',
              '                Vector3 position = new Vector3(Mathf.Sin(radians) * 1.46f, 0.58f, Mathf.Cos(radians) * 1.46f);',
              'core stabilizer radius')
          replace_once(
              '                Part("Reactor Armor Fin", polish, _blade, position, new Vector3(0.55f, 1.05f, 0.68f), armor, new Vector3(0f, angle, 0f));',
              '                Part("Reactor Armor Fin", polish, _blade, position, new Vector3(0.38f, 0.80f, 0.46f), _materials["graphite"], new Vector3(0f, angle, 0f));',
              'core stabilizer armor')
          replace_once(
              '                Part("Reactor Fin Energy", polish, _blade, position + Vector3.up * 0.20f, new Vector3(0.12f, 0.55f, 0.16f), energy, new Vector3(0f, angle, 0f));',
              '                Part("Reactor Fin Energy", polish, _blade, position + Vector3.up * 0.16f, new Vector3(0.09f, 0.38f, 0.11f), energy, new Vector3(0f, angle, 0f));',
              'core stabilizer energy')

          replace_once('            if (socket != null) socket.localScale = new Vector3(0.72f, 0.66f, 0.72f);', '            if (socket != null) socket.localScale = new Vector3(0.62f, 0.58f, 0.62f);', 'tower socket scale')
          replace_once('                yaw.localScale = Vector3.one * 0.80f;', '                yaw.localScale = Vector3.one * 0.72f;', 'tower yaw scale')
          replace_once('                yaw.localPosition = new Vector3(0f, 0.68f, 0f);', '                yaw.localPosition = new Vector3(0f, 0.62f, 0f);', 'tower yaw position')
          replace_once(
              '            Part("Tower Armor Collar", polish, _ring, new Vector3(0f, 0.52f, 0f), new Vector3(1.20f, 1.20f, 1.20f), armor);',
              '            Part("Tower Armor Collar", polish, _plate, new Vector3(0f, 0.48f, 0f), new Vector3(1.02f, 0.16f, 1.02f), armor);',
              'tower collar form')
          replace_once(
              '            Part("Tower Floor Aperture", polish, _ring, new Vector3(0f, 0.14f, 0f), new Vector3(1.48f, 1.48f, 1.48f), _materials["edge"]);',
              '            Part("Tower Floor Aperture", polish, _plate, new Vector3(0f, 0.12f, 0f), new Vector3(1.32f, 0.10f, 1.38f), _materials["graphite"]);',
              'tower floor form')
          replace_once(
              '            Part("Tower Energy Spine", polish, _blade, new Vector3(0f, 0.76f, 0f), new Vector3(0.14f, 0.58f, 0.14f), energy);',
              '            Part("Tower Energy Spine", polish, _blade, new Vector3(0f, 0.70f, 0f), new Vector3(0.10f, 0.46f, 0.10f), energy);',
              'tower energy spine')

          replace_once(
              '                CrownUnit unit = units[i];\n                if (unit == null) continue;\n                Transform root = FindDeep(unit.transform, "QUATERNIUS ART // UNIT");',
              '                CrownUnit unit = units[i];\n                if (unit == null) continue;\n                if (FindDeep(unit.transform, "HYBRID POLISH // UNIT") != null) continue;\n                Transform root = FindDeep(unit.transform, "QUATERNIUS ART // UNIT");',
              'hybrid unit duplicate guard')
          replace_once('                            body.localScale = new Vector3(0.92f, 0.92f, 0.92f);', '                            body.localScale = new Vector3(0.80f, 0.80f, 0.80f);', 'tank unit scale')
          replace_once('                            body.localScale = Vector3.one * 0.70f;', '                            body.localScale = Vector3.one * 0.58f;', 'raider unit scale')
          replace_once('                            body.localScale = new Vector3(0.86f, 1.38f, 0.90f);', '                            body.localScale = new Vector3(0.70f, 1.50f, 0.72f);', 'assault unit scale')
          replace_once(
              '                Part("Unit Ground Signature", polish, _ring, new Vector3(0f, 0.08f, 0f), unit.Kind == CrownUnitKind.Tank ? new Vector3(0.84f, 0.84f, 0.84f) : new Vector3(0.58f, 0.58f, 0.58f), energy);',
              '                Part("Unit Ground Signature", polish, _plate, new Vector3(0f, 0.05f, 0f), unit.Kind == CrownUnitKind.Tank ? new Vector3(0.72f, 0.06f, 0.82f) : new Vector3(0.48f, 0.05f, 0.58f), _materials["abyss"]);',
              'unit ground signature')

          replace_once(
              '            CreatePointLight(lightRoot, "Vanguard Rim", new Vector3(-10f, 6.5f, -3f), 7.0f, 31f, new Color(0.08f, 0.42f, 1f));',
              '            CreatePointLight(lightRoot, "Vanguard Rim", new Vector3(-10f, 6.5f, -3f), 4.2f, 31f, new Color(0.08f, 0.42f, 1f));',
              'vanguard rim intensity')
          replace_once(
              '            CreatePointLight(lightRoot, "Hostile Rim", new Vector3(10f, 7.5f, 7f), 7.4f, 31f, new Color(1f, 0.17f, 0.035f));',
              '            CreatePointLight(lightRoot, "Hostile Rim", new Vector3(10f, 7.5f, 7f), 4.4f, 31f, new Color(1f, 0.17f, 0.035f));',
              'hostile rim intensity')
          replace_once(
              '            CreatePointLight(lightRoot, "Crown Key", new Vector3(0f, 12f, 3f), 4.8f, 28f, new Color(0.72f, 0.84f, 1f));',
              '            CreatePointLight(lightRoot, "Crown Key", new Vector3(0f, 12f, 3f), 4.2f, 28f, new Color(0.72f, 0.84f, 1f));',
              'crown key intensity')

          runtime.write_text(text, encoding='utf-8')

          capture = Path('unity/crown-front/Assets/Editor/CrownArtRebootReviewCapture.cs')
          capture_text = capture.read_text(encoding='utf-8')
          old = '            quaternius.SendMessage("SkinUnits", SendMessageOptions.DontRequireReceiver);\n            PositionClashUnits();'
          new = '            quaternius.SendMessage("SkinUnits", SendMessageOptions.DontRequireReceiver);\n            hybrid.SendMessage("RefineUnits", SendMessageOptions.DontRequireReceiver);\n            PositionClashUnits();'
          count = capture_text.count(old)
          if count != 1:
              raise SystemExit(f'clash evidence hook: expected one exact match, found {count}')
          capture.write_text(capture_text.replace(old, new, 1), encoding='utf-8')

          print('Hybrid value hierarchy and clash evidence pass applied.')
          PY

          git rm -f \
            .github/workflows/refine-quaternius-hero-frame.yml \
            .github/workflows/refine-quaternius-hybrid-value-hierarchy.yml

      - name: Commit and push controlled refinement
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/crown-front-art-reboot-hero-frame'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            unity/crown-front/Assets/_Project/Runtime/CrownQuaterniusHybridPolish.cs \
            unity/crown-front/Assets/Editor/CrownArtRebootReviewCapture.cs
          git add -u .github/workflows
          git diff --cached --check
          git commit -m 'feat: refine Quaternius value hierarchy'

          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin "HEAD:$branch"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
